  <template id="intro-template">
<div class="guide-summary"><div class="guide-stats"><div><strong>45</strong><span>問</span></div><div><strong>3</strong><span>部分</span></div><div><strong>30</strong><span>分</span></div></div><p>原教材によると、HSK（四級）の聴解は３つの部分、計45問です。試験では音声が各問１回流れ、解答時間は約30分と説明されています。この電子教材では、練習のために音声を繰り返し再生できます。</p></div>
      <div class="section-head"><h2>３つの部分</h2><small>原教材の説明より</small></div>
      <div class="guide-grid">
        <article class="guide-card"><span class="guide-part">第一部分 · 第1〜10問</span><h3>正誤を判断する</h3><p>短い録音を聴き、提示された文が内容と一致するかを判断します。解答時間の目安は１問につき約10秒です。</p><div class="guide-tip"><strong>聴く前に</strong><span>文中の鍵となる単語を見つけておきましょう。</span></div></article>
        <article class="guide-card"><span class="guide-part">第二部分 · 第11〜25問</span><h3>短い会話を聴く</h3><p>会話と質問を聴き、４つの選択肢から答えを選びます。解答時間の目安は１問につき約17秒です。</p><div class="guide-tip"><strong>聴く前に</strong><span>選択肢を先に読み、日常表現とキーワードに注目しましょう。</span></div></article>
        <article class="guide-card"><span class="guide-part">第三部分 · 第26〜45問</span><h3>長めの内容をつかむ</h3><p>長めの会話や説明文を聴き、質問に最も合う答えを４つの中から選びます。解答時間の目安は１問につき約17秒です。</p><div class="guide-tip"><strong>聴く前に</strong><span>選択肢から話題を予測し、慣用表現や要点を聴き取りましょう。</span></div></article>
      </div>
      <div class="section-head guide-usage-title"><h2>この教材の使い方</h2><small>初めて使う人へ</small></div>
      <ol class="guide-usage">
        <li><span class="guide-step">01</span><div><h3>課を選び、表現と単語を聴く</h3><p>第一課から第五課まで選べます。「表現・単語」で中国語と日本語訳を見ながら表現・単語のカードを押して発音を聴きましょう。ピンインは必要なときに表示できます。</p></div></li>
        <li><span class="guide-step">02</span><div><h3>聴解練習で答える</h3><p>第一～第三部分を選び、音声を聴いて小問に答えます。小問は毎回ランダムに並び、同じ音声の２問は一緒に表示されます。カードをもう一度押すと一時停止・再開できます。画面下のプレーヤーで停止と再生速度の変更ができます（初期値は１倍速）。</p></div></li>
        <li><span class="guide-step">03</span><div><h3>結果と原文を確認する</h3><p>正解すると励ましの言葉が表示されます。間違えた場合は正解と聴解原文がすぐに表示され、確認後にその問題だけ再挑戦できます。正解した問題も「聴解原文を見る」で確認できます。</p></div></li>
        <li><span class="guide-step">04</span><div><h3>もう一度練習する</h3><p>「この部分をもう一度」でその部分の解答を消し、順番を変えて挑戦できます。解答状況は使っているブラウザーに保存されます。</p></div></li>
      </ol>
